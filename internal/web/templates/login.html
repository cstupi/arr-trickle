{{define "title"}}Log in{{end}}
{{define "content"}}
<div class="auth card">
  <h1>Log in</h1>
  {{with .Error}}<p class="error">{{.}}</p>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label class="field"><span>Username</span><input name="username" autocomplete="username" required maxlength="64" autofocus></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
    <button type="submit">Log in</button>
  </form>
  <p class="hint">Forgot the password? Run <code>arr-trickle reset-password</code> in the container and use the new setup code.</p>
</div>
{{end}}
