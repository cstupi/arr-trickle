name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # weekly: catch *arr API changes in new upstream releases
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Scans the full git history, so a key committed and later "removed" still fails the build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:v8.21.2 git /repo --no-banner --redact -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go mod verify
      - run: go vet ./... && go vet -tags integration ./integration/
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Tests (race detector) with coverage of at least 90%
        run: |
          pkgs="$(go list ./internal/... | grep -v /testutil | paste -sd, -)"
          go test -race -count=1 -coverpkg="$pkgs" -coverprofile=cover.out ./...
          total="$(go tool cover -func=cover.out | awk '/^total:/ {sub("%", "", $3); print $3}')"
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 90) ? 0 : 1 }'

  integration:
    # Real Sonarr/Radarr/Lidarr in throwaway containers: catches upstream API drift.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: scripts/integration.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: docker build -t arr-trickle:ci .
      - name: Image runs, rejects bad config, accepts the example
        run: |
          docker run --rm arr-trickle:ci --version
          printf '<Config><ApiKey>fakefakefakefakefakefakefakefake</ApiKey></Config>' > "$RUNNER_TEMP/config.xml"
          chmod 644 "$RUNNER_TEMP/config.xml"
          docker run --rm -v "$PWD/examples:/config:ro" -e LIDARR_API_KEY=fakefakefakefakefakefakefakefake \
            -v "$RUNNER_TEMP/config.xml:/arr/sonarr/config.xml:ro" -v "$RUNNER_TEMP/config.xml:/arr/radarr/config.xml:ro" \
            arr-trickle:ci validate
          ! docker run --rm -e SONARR_URL=ftp://x arr-trickle:ci validate
      - name: Web UI starts read-only, prints a setup code, and protects its pages
        run: |
          docker run -d --name ui --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            --tmpfs /state:uid=65534,gid=65534 -p 127.0.0.1:8790:8790 arr-trickle:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8790/healthz && break; sleep 1; done
          test "$(curl -fs http://127.0.0.1:8790/healthz)" = ok
          docker logs ui 2>&1 | grep -q "Setup code: "
          test "$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://127.0.0.1:8790/settings)" = "303 http://127.0.0.1:8790/login"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8790/control/run-now)" = 401
          docker exec ui /arr-trickle healthcheck
          docker rm -f ui
      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: arr-trickle:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
