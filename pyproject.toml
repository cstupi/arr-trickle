[project]
name = "arr-trickle"
dynamic = ["version"]
description = "Work through the Sonarr/Radarr/Lidarr missing and upgrade backlog a few searches at a time"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []  # standard library only, by design

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
arr-trickle = "arr_trickle.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "arr_trickle.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra --strict-markers"
markers = ["integration: needs live Sonarr/Radarr/Lidarr (see scripts/test-arrs.sh)"]

[tool.coverage.run]
source = ["arr_trickle"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:", "\\.\\.\\."]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PL"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR2004", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLC0415"]

[tool.mypy]
strict = true
files = ["src"]
